<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">番茄基地各功能位置示意图</title><rect width="1000" height="650" rx="24" fill="#fff8ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="28" fill="#493c30" font-weight="600">你的专注工作台</text><text x="36" y="79" font-size="18" fill="#897463" font-weight="400">先认位置，再开始第一颗番茄。</text><rect x="30" y="105" width="940" height="70" rx="16" fill="#fcebd8" stroke="#ebdac7"/><circle cx="56" cy="140" r="16" fill="#cf552e"/><text x="51" y="146" font-size="17" fill="white" font-weight="600">1</text><text x="82" y="147" font-size="21" fill="#493c30" font-weight="600">用户名 · 同步 · 深浅模式 · 全屏</text><rect x="30" y="195" width="275" height="225" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="55" cy="226" r="16" fill="#cf552e"/><text x="50" y="232" font-size="17" fill="white" font-weight="600">2</text><text x="81" y="233" font-size="21" fill="#493c30" font-weight="600">To Do Lists</text><text x="50" y="278" font-size="17" fill="#897463" font-weight="400">今天推进哪些事？</text><text x="50" y="311" font-size="17" fill="#897463" font-weight="400">任务、预估番茄、当前进度</text><rect x="325" y="195" width="350" height="225" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="350" cy="226" r="16" fill="#cf552e"/><text x="345" y="232" font-size="17" fill="white" font-weight="600">3</text><text x="376" y="233" font-size="21" fill="#493c30" font-weight="600">核心番茄钟</text><text x="345" y="278" font-size="28" fill="#c7532d" font-weight="400">25:00</text><text x="345" y="311" font-size="17" fill="#897463" font-weight="400">开始 → 保存状态 → 填写回顾</text><rect x="695" y="195" width="275" height="225" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="720" cy="226" r="16" fill="#cf552e"/><text x="715" y="232" font-size="17" fill="white" font-weight="600">4</text><text x="746" y="233" font-size="21" fill="#493c30" font-weight="600">目标与统计</text><text x="715" y="278" font-size="17" fill="#897463" font-weight="400">今天还差多少？</text><text x="715" y="311" font-size="17" fill="#897463" font-weight="400">有效番茄、实际记录、折算时长</text><rect x="30" y="440" width="550" height="130" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="55" cy="471" r="16" fill="#cf552e"/><text x="50" y="477" font-size="17" fill="white" font-weight="600">5</text><text x="81" y="478" font-size="21" fill="#493c30" font-weight="600">番茄记录 / 数据与通知</text><text x="50" y="523" font-size="17" fill="#897463" font-weight="400">选择日期、编辑记录、导出备份</text><rect x="600" y="440" width="370" height="130" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="625" cy="471" r="16" fill="#cf552e"/><text x="620" y="477" font-size="17" fill="white" font-weight="600">6</text><text x="651" y="478" font-size="21" fill="#493c30" font-weight="600">长期倒计时 / 最近复制</text><text x="620" y="523" font-size="17" fill="#897463" font-weight="400">目标日期、GO / BACK 文本</text><text x="37" y="612" font-size="18" fill="#493c30" font-weight="400">页面最下方：「使用说明」可随时回到这份指南。</text></g></svg>