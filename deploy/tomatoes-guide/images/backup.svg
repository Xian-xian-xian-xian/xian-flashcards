<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-labelledby="title"><title id="title">本机、云端同步与独立备份的关系</title><rect width="1000" height="415" rx="24" fill="#fff8ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="28" fill="#493c30" font-weight="600">同步负责接续，备份负责留底</text><rect x="35" y="100" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="55" y="145" font-size="23" fill="#493c30" font-weight="600">当前浏览器</text><text x="55" y="197" font-size="16" fill="#897463" font-weight="400">操作先保存在本机</text><text x="55" y="235" font-size="16" fill="#897463" font-weight="400">网络恢复后点击「同步」</text><rect x="355" y="100" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="375" y="145" font-size="23" fill="#493c30" font-weight="600">当前账号的云端</text><text x="375" y="197" font-size="16" fill="#897463" font-weight="400">用于同一账号换设备接续</text><text x="375" y="235" font-size="16" fill="#897463" font-weight="400">离开前确认「已同步」</text><rect x="675" y="100" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="695" y="145" font-size="23" fill="#493c30" font-weight="600">你保存的 JSON 文件</text><text x="695" y="197" font-size="16" fill="#897463" font-weight="400">完整状态的独立副本</text><text x="695" y="235" font-size="16" fill="#897463" font-weight="400">覆盖导入前，先导出当前版本</text><text x="330" y="198" font-size="22" fill="#cf552e" font-weight="400">⇄</text><text x="652" y="198" font-size="22" fill="#cf552e" font-weight="400">→</text><rect x="35" y="315" width="930" height="72" rx="16" fill="#fff0e4" stroke="#f0d4ba"/><text x="55" y="346" font-size="18" fill="#493c30" font-weight="400">CSV：导出所选日期的表格，方便查看与整理。</text><text x="55" y="374" font-size="17" fill="#493c30" font-weight="400">JSON：用于完整备份与恢复；「覆盖导入」会替换当前全部状态，并同步到账号。</text></g></svg>