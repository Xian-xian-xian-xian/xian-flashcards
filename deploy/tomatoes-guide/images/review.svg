<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title"><title id="title">回顾表单与连续专注的填写示例</title><rect width="1000" height="510" rx="24" fill="#fff8ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="28" fill="#493c30" font-weight="600">回顾填写示例</text><text x="35" y="80" font-size="18" fill="#897463" font-weight="400">假设：今天要读完一本书的第 3 章，目前累计读完 40%。</text><rect x="30" y="105" width="550" height="375" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="52" y="142" font-size="15" fill="#897463" font-weight="400">任务完成情况</text><text x="52" y="169" font-size="18" fill="#493c30" font-weight="400">阅读第 3 章，完成练习 1—4</text><text x="52" y="207" font-size="15" fill="#897463" font-weight="400">完成百分比</text><text x="52" y="234" font-size="18" fill="#493c30" font-weight="400">40（整项 To Do 的当前累计进度）</text><text x="52" y="272" font-size="15" fill="#897463" font-weight="400">身体电量 / 心情</text><text x="52" y="299" font-size="18" fill="#493c30" font-weight="400">6.5 / 8（0—10 分）</text><text x="52" y="337" font-size="15" fill="#897463" font-weight="400">番茄状况 / 关联 To Do</text><text x="52" y="364" font-size="18" fill="#493c30" font-weight="400">有小瑕疵 / 阅读第 3 章</text><text x="52" y="402" font-size="15" fill="#897463" font-weight="400">备注</text><text x="52" y="429" font-size="18" fill="#493c30" font-weight="400">中途分心一次，下次先关消息</text><rect x="610" y="105" width="360" height="175" rx="16" fill="#edf2e7" stroke="#d4ddc8"/><text x="633" y="142" font-size="22" fill="#493c30" font-weight="600">想继续下一颗？</text><text x="633" y="181" font-size="19" fill="#493c30" font-weight="400">本次休息：5 分钟</text><text x="633" y="214" font-size="19" fill="#493c30" font-weight="400">下个番茄：25 分钟</text><text x="633" y="253" font-size="16" fill="#65704f" font-weight="400">两项都填；都留空则手动开始。</text><rect x="610" y="300" width="360" height="180" rx="16" fill="#fff0e4" stroke="#f0d4ba"/><text x="633" y="338" font-size="22" fill="#493c30" font-weight="600">提交后发生什么？</text><text x="633" y="379" font-size="19" fill="#493c30" font-weight="400">① 保存一条记录</text><text x="633" y="412" font-size="19" fill="#493c30" font-weight="400">② 更新关联任务的百分比</text><text x="633" y="445" font-size="19" fill="#493c30" font-weight="400">③ 生成并尝试复制 BACK</text></g></svg>