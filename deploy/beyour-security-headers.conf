add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://card.beyour.top https://tomato.beyour.top https://tomatogame.beyour.top; frame-src 'self' https://card.beyour.top https://tomato.beyour.top https://tomatogame.beyour.top; frame-ancestors 'self' https://card.beyour.top https://tomato.beyour.top https://tomatogame.beyour.top; object-src 'none'; base-uri 'self'; form-action 'self'" always;
limit_req zone=beyour_api burst=90 nodelay;
limit_req_status 429;
limit_conn beyour_connections 80;
limit_conn_status 429;
client_body_timeout 15s;
location ~ /\.(?!well-known/) { return 404; }
