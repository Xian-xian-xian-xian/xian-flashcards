<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">实际记录、有效番茄和折算时长的区别</title><rect width="1000" height="390" rx="24" fill="#fff8ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="35" y="47" font-size="28" fill="#493c30" font-weight="600">三个数字，三个含义</text><rect x="30" y="92" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="50" y="132" font-size="20" fill="#493c30" font-weight="400">实际记录</text><text x="50" y="193" font-size="36" fill="#c7532d" font-weight="600">3 条</text><text x="50" y="246" font-size="16" fill="#897463" font-weight="400">每提交一次回顾，增加一条</text><rect x="355" y="92" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="375" y="132" font-size="20" fill="#493c30" font-weight="400">有效番茄</text><text x="375" y="193" font-size="36" fill="#c7532d" font-weight="600">2.4 个</text><text x="375" y="246" font-size="16" fill="#897463" font-weight="400">1 + 0.9 + 0.5 的权重之和</text><rect x="680" y="92" width="290" height="185" rx="16" fill="#ffffff" stroke="#ebdac7"/><text x="700" y="132" font-size="20" fill="#493c30" font-weight="400">折算时长</text><text x="700" y="193" font-size="36" fill="#c7532d" font-weight="600">60 分钟</text><text x="700" y="246" font-size="16" fill="#897463" font-weight="400">2.4 × 25 分钟</text><text x="40" y="320" font-size="19" fill="#493c30" font-weight="400">示例：完美的番茄 1.0 + 有小瑕疵 0.9 + 半个番茄 0.5 = 2.4 个有效番茄。</text><text x="40" y="355" font-size="19" fill="#897463" font-weight="400">折算时长采用固定的 25 分钟权重口径，并非实际计时分钟的总和。</text></g></svg>