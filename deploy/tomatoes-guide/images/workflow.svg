<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title"><title id="title">从开始计时到回顾休息的四步流程</title><rect width="1000" height="420" rx="24" fill="#fff8ee"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#493c30" font-weight="600">一颗番茄，怎样完整收下？</text><rect x="30" y="100" width="220" height="180" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="57" cy="132" r="16" fill="#cf552e"/><text x="52" y="138" font-size="17" fill="white" font-weight="600">1</text><text x="83" y="139" font-size="21" fill="#493c30" font-weight="600">开始</text><text x="48" y="192" font-size="16" fill="#493c30" font-weight="400">计时立即启动</text><text x="48" y="227" font-size="15" fill="#897463" font-weight="400">默认 25 分钟</text><text x="255" y="195" font-size="22" fill="#cf552e" font-weight="400">→</text><rect x="275" y="100" width="220" height="180" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="302" cy="132" r="16" fill="#cf552e"/><text x="297" y="138" font-size="17" fill="white" font-weight="600">2</text><text x="328" y="139" font-size="21" fill="#493c30" font-weight="600">保存状态</text><text x="293" y="192" font-size="16" fill="#493c30" font-weight="400">任务 + 电量 + 心情</text><text x="293" y="227" font-size="15" fill="#897463" font-weight="400">生成 GO 文本</text><text x="500" y="195" font-size="22" fill="#cf552e" font-weight="400">→</text><rect x="520" y="100" width="220" height="180" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="547" cy="132" r="16" fill="#cf552e"/><text x="542" y="138" font-size="17" fill="white" font-weight="600">3</text><text x="573" y="139" font-size="21" fill="#493c30" font-weight="600">专注 / 回顾</text><text x="538" y="192" font-size="16" fill="#493c30" font-weight="400">最后 2 分钟可回顾</text><text x="538" y="227" font-size="15" fill="#897463" font-weight="400">提交后生成记录和 BACK</text><text x="745" y="195" font-size="22" fill="#cf552e" font-weight="400">→</text><rect x="765" y="100" width="220" height="180" rx="16" fill="#ffffff" stroke="#ebdac7"/><circle cx="792" cy="132" r="16" fill="#cf552e"/><text x="787" y="138" font-size="17" fill="white" font-weight="600">4</text><text x="818" y="139" font-size="21" fill="#493c30" font-weight="600">休息 / 下一颗</text><text x="783" y="192" font-size="16" fill="#493c30" font-weight="400">默认休息 5 分钟</text><text x="783" y="227" font-size="15" fill="#897463" font-weight="400">连续专注需在回顾中设置</text><rect x="30" y="310" width="940" height="80" rx="16" fill="#edf2e7" stroke="#d4ddc8"/><text x="52" y="344" font-size="20" fill="#493c30" font-weight="400">专注结束后自动进入休息；回顾可以在休息中提交。</text><text x="52" y="373" font-size="17" fill="#65704f" font-weight="400">只有提交回顾，才会新增一条番茄记录。</text></g></svg>